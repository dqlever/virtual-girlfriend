<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>💕 登录</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  background: linear-gradient(135deg, #ff6b9d 0%, #ff8fab 50%, #ffb3c6 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  min-height: 100vh;
}
.login-card {
  background: rgba(255,255,255,0.95);
  border-radius: 24px;
  padding: 40px 32px;
  width: 85%;
  max-width: 360px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
  text-align: center;
  animation: slideIn 0.4s ease;
}
@keyframes slideIn {
  from { opacity: 0; transform: translateY(30px); }
  to { opacity: 1; transform: translateY(0); }
}
.login-avatar {
  font-size: 56px;
  margin-bottom: 12px;
}
.login-title {
  font-size: 22px;
  font-weight: 600;
  color: #333;
  margin-bottom: 6px;
}
.login-subtitle {
  font-size: 14px;
  color: #999;
  margin-bottom: 28px;
}
.input-wrap {
  position: relative;
  margin-bottom: 20px;
}
.input-wrap input {
  width: 100%;
  padding: 14px 16px 14px 44px;
  border: 2px solid #eee;
  border-radius: 12px;
  font-size: 16px;
  outline: none;
  transition: border-color 0.2s;
  background: #f9f9f9;
}
.input-wrap input:focus {
  border-color: #ff6b9d;
  background: white;
}
.input-wrap .input-icon {
  position: absolute;
  left: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 18px;
}
.login-btn {
  width: 100%;
  padding: 14px;
  background: linear-gradient(135deg, #ff6b9d, #ff8fab);
  color: white;
  border: none;
  border-radius: 12px;
  font-size: 16px;
  font-weight: 600;
  cursor: pointer;
  transition: opacity 0.2s, transform 0.1s;
}
.login-btn:active { transform: scale(0.98); }
.login-btn:disabled { opacity: 0.6; }
.error-msg {
  color: #e74c3c;
  font-size: 14px;
  margin-top: 12px;
  min-height: 20px;
  transition: opacity 0.2s;
}
.error-msg.hidden { opacity: 0; }
</style>
</head>
<body>

<div class="login-card">
  <div class="login-avatar">💕</div>
  <div class="login-title">私人空间</div>
  <div class="login-subtitle">请输入密码进入</div>
  <form id="login-form">
    <div class="input-wrap">
      <span class="input-icon">🔒</span>
      <input type="password" id="password" placeholder="请输入密码" autocomplete="current-password">
    </div>
    <button type="submit" class="login-btn" id="login-btn">进入</button>
    <div class="error-msg hidden" id="error-msg"></div>
  </form>
</div>

<script>
const form = document.getElementById("login-form");
const input = document.getElementById("password");
const btn = document.getElementById("login-btn");
const errorMsg = document.getElementById("error-msg");

input.focus();

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const pwd = input.value.trim();
  if (!pwd) return;

  btn.disabled = true;
  btn.textContent = "验证中...";
  errorMsg.classList.add("hidden");

  try {
    const res = await fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: pwd }),
    });
    const data = await res.json();

    if (data.success) {
      btn.textContent = "进入中...";
      window.location.href = "/";
    } else {
      throw new Error(data.message || "密码错误");
    }
  } catch (err) {
    errorMsg.textContent = err.message;
    errorMsg.classList.remove("hidden");
    btn.disabled = false;
    btn.textContent = "进入";
    input.select();
  }
});
</script>
</body>
</html>
